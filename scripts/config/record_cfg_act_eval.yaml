# ACT 策略真机评估配置
# 基于 record_cfg.yaml，改为 run_policy 模式 + 安全参数
#
# 使用方法：cp record_cfg_act_eval.yaml record_cfg.yaml && franka-record
#
# 首次真机流程：
#   1. debug: 1, fps: 5  → 只看 action 输出，不执行
#   2. debug: 0, fps: 5  → 低速真机，手放急停按钮
#   3. fps: 10 → 15      → 逐步提速
#
# ACT action space: 8 维绝对关节角 (joint_1..7.pos + gripper_position)
# 与 isoteleop 录制数据完全一致，不需要额外对齐

record:
  repo_id: &repo_id "babycare/act_eval"
  debug: 1                  # ⚠ 首次务必设 1！确认 action 合理后再改 0
  user_notes: "ACT policy evaluation on real Franka"
  fps: 5                   # ⚠ 首次务必低速！确认安全后再提到 10/15
  control_mode: &control_mode "isoteleop"
  run_mode: "run_policy"   # 策略控制模式

  teleop:
    control_mode: *control_mode
    dynamixel_config:
      port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTBYEU26-if00-port0"
      hardware_offsets: [-0.12183455210997171, -0.002845966063342931, -0.06250428305273764, -2.0498354593763044, 0.05259129256457092, 1.9984585428810417, -0.9046528345737315]
      use_gripper: &use_gripper True
      joint_ids: [1, 2, 3, 4, 5, 6, 7]
      joint_offsets: [3.142, 3.142, 3.142, 3.142, 1.571, 1.571, 7.068]
      joint_signs: [1, -1, 1, 1, 1, 1, 1]
      gripper_config: [8, 0.9664079, 1.9404857]
    spacemouse_config:
      channel_ids: [0, 1, 2, 3, 4, 5]
      channel_signs: [-1, -1, 1, -1, -1, 1]
      use_gripper: *use_gripper
      pose_scaler: [0.01, 0.05]
    oculus_config:
      ip: "192.168.110.62"
      use_gripper: *use_gripper
      pose_scaler: [3.0, 2.0]
      channel_signs: [1, 1, 1, -1, -1, 1]
    placo:
      visualize_placo: False
      placo_dt: 0.01
      enable_ik: False
      robot_ip: "192.168.110.15"
      robot_port: 5252
      ik_urdf_path: "assets/franka_urdf/fr3v2_no_mesh.urdf"
      ik_iterations: 30
      ik_pos_weight: 8.0
      ik_ori_weight: 3.0
      ik_joints_weight: 0.2
      ik_regularization: 1.0e-4

  robot:
    ip: &ip "192.168.1.100"    # NUC ip
    use_gripper: *use_gripper
    close_threshold: 0.7
    gripper_bin_threshold: 0.98
    gripper_reverse: false
    gripper_max_open: 0.085
    execute_mode: "ee_pose"

  policy:
    type: "act"
    device: "cuda"
    push_to_hub: False
    # ← 填你的 ACT checkpoint 路径，必须包含 config.json
    pretrained_path: "/home/deepcybo/lerobot/franka_workspace/outputs/zhonghuai/lajiao_20260318_merged/act_test2/checkpoints/last/pretrained_model"

  task:
    description: "pick up the Shanghai Green and put them into the brown basket"  # 必须与训练时一致
    num_episodes: 1         # 首次只跑 1 个 episode
    display: True
    resume: false
    resume_dataset: ""

  time:
    episode_time_sec: 30    # 首次真机 30s 够观察，确认安全后再加长
    reset_time_sec: 30
    save_meta_period: 1

  cameras:
    wrist_cam_serial: "244222071902"
    exterior_cam_serial: "401622070138"
    width: 424
    height: 240

  storage:
    push_to_hub: False

replay:
  dataset_name: babycare/act_eval
  episode_idx: 0
  robot:
    ip: *ip
  control_mode: *control_mode

visualize:
  dataset_name: babycare/act_eval
  episode_index: 0
